name: Deploy to yamz (Production)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, yamz-prd-runner]
    environment: production  # ← Requires manual approval from maintainers
    
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest main branch changes
        run: |
          cd ~/prd/yamz
          git fetch origin
          git pull origin main

      - name: Create pre-deployment backup
        run: |
          mkdir -p ~/backup/yamz_prd
          BACKUP_FILE="~/backup/yamz_prd/backup_$(date +%Y%m%d_%H%M%S).sql.gz"
          set +x  # Hide command with password from logs
          pg_dump -U postgres yamz_prd | gzip > "$BACKUP_FILE"
          set -x
          echo "Backup created: $BACKUP_FILE"
          
          # Keep only 7 latest backups
          ls -t ~/backup/yamz_prd/backup_*.sql.gz | tail -n +8 | xargs rm -f

      - name: Update latest symlink
        run: |
          ln -sf ~/backup/yamz_prd/backup_$(date +%Y%m%d_%H%M%S).sql.gz ~/backup/yamz_prd/latest.sql.gz

      - name: Set up Python virtual environment
        run: |
          cd ~/prd/yamz
          python3 -m venv env
          source env/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: |
          cd ~/prd/yamz
          source env/bin/activate
          export FLASK_APP=yamz.py
          set +x  # Hide environment variables from logs
          flask db migrate
          flask db upgrade
          set -x
        env:
          SQLALCHEMY_DATABASE_URI: "${{ secrets.YAMZ_PRD_DB_URI }}"

      - name: Restart yamz service
        run: |
          sudo service yamz restart
          sleep 3

      - name: Verify service status
        run: |
          sudo service yamz status

      - name: Health check (with retries)
        run: |
          for attempt in {1..5}; do
            echo "Health check attempt $attempt of 5..."
            sleep 3
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://yamz.net/term/ark:99152/h8072")
            if [ "$status" = "200" ]; then
              echo "✓ Health check passed: yamz is responding"
              exit 0
            fi
            echo "✗ Attempt $attempt failed with HTTP status $status"
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Check logs for errors
        if: always()
        run: |
          echo "=== Recent yamz production logs ==="
          tail -n 50 ~/prd/yamz/logs/yamz.log 2>/dev/null || echo "Log file not found"

      - name: Notify deployment success
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || 1,
              body: '✅ **Production deployment successful** - yamz.net is live'
            })

      - name: Notify deployment failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 URGENT: Production deployment failed',
              labels: ['urgent', 'ops'],
              body: `
              **Deployment Status:** FAILED
              **Branch:** main
              **Workflow Run:** ${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
              
              ## Immediate Actions:
              1. Check workflow logs above
              2. Verify service: \`sudo service yamz status\`
              3. Check logs: \`tail -f ~/prd/yamz/logs/yamz.log\`
              4. **ROLLBACK if needed:**
                 \`\`\`bash
                 sudo service yamz stop
                 gunzip ~/backup/yamz_prd/latest.sql.gz
                 dropdb -U postgres yamz_prd
                 psql -U postgres -f ~/backup/yamz_prd/latest.sql
                 sudo service yamz start
                 \`\`\`
              5. Update this issue with status
              `
            })
